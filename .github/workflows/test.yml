name: Playwright Automation Suite

# Trigger this pipeline automatically on every push or pull request to the main branch
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip' # Speeds up subsequent runs by caching dependencies

      - name: Install Project Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Isolated Playwright Browsers
        run: playwright install chromium --with-deps

      - name: Archive Failure Artifact Screenshots
        if: failure() # Only executes this step if a test fails
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-screenshots
          path: screenshots/
          retention-days: 7

      - name: Execute Automated Test Matrix
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        # This overrides local pytest.ini flags
        run: pytest -o addopts="-v --base-url=https://automationteststore.com"

      # ─── 📊 ALLURE COMPILATION & DEPLOYMENT SECTION ─────────────────────────
      - name: Load Allure Report History
        uses: actions/checkout@v4
        if: always() # Ensures reports are generated even if tests fail
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Dynamic Allure Report Dashboard
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure Report Website to GitHub Pages
        uses: peaceiris/actions-gh-pages-action@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
