name: Playwright Automation Suite

# Trigger this pipeline automatically on every push or pull request to the main branch
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip' # Speeds up subsequent runs by caching dependencies

      - name: Install Project Libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Isolated Playwright Browsers
        run: playwright install chromium --with-deps

      - name: Execute Automated Test Matrix
        # We inject your secret environment variables securely into the runner environment
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        # Run headlessly in CI, overriding the headed flag from pytest.ini
        run: pytest --headless

      - name: Archive Failure Artifact Screenshots
        if: failure() # Only executes this step if a test fails
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-screenshots
          path: screenshots/
          retention-days: 7

      - name: Execute Automated Test Matrix
        env:
          STORE_USER: ${{ secrets.STORE_USER }}
          STORE_PASS: ${{ secrets.STORE_PASS }}
        # This overrides local pytest.ini flags
        run: pytest -o addopts=""
